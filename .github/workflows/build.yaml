name: Build Docker Image

on:
  release:
    types:
      - published
      - edited
  # Uncomment to also build and push on every merge to main:
  # push:
  #   branches:
  #     - main
  workflow_dispatch: ~

jobs:
  build:
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: rdurica/php-platform/.github/workflows/reusable-build.yaml@v1.0.1
