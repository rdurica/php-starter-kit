services:
  app:
    image: ghcr.io/rdurica/php-platform/ci:1.1.0-php8.5
    working_dir: /app/src
    volumes:
      - ./src:/app/src
    environment:
      - APP_ENV=testing
      - DB_CONNECTION=sqlite
      - "DB_DATABASE=:memory:"
      - CACHE_DRIVER=array
      - CACHE_STORE=array
      - SESSION_DRIVER=array
      - QUEUE_CONNECTION=sync
