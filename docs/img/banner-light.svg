<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img">
  <title>PHP Starter Kit — Zero-boilerplate PHP stack, ready in seconds</title>
  <defs>
    <linearGradient id="cardBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <radialGradient id="glowSkyLight" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigoLight" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headlineGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <pattern id="dotGridLight" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" fill-opacity="0.7"/>
    </pattern>
    <clipPath id="outerClipLight">
      <rect x="1" y="1" width="1198" height="338" rx="16"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <g clip-path="url(#outerClipLight)">
    <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#cardBgLight)"/>
    <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#dotGridLight)"/>
    <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#glowSkyLight)"/>
    <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#glowIndigoLight)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Left Column: Eyebrow Pill -->
  <rect x="44" y="34" width="316" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="62" cy="48" r="4" fill="#4F46E5"/>
  <text x="208" y="52" text-anchor="middle" fill="#0284C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1">FRANKENPHP · MODERN PHP · DOCKER</text>

  <!-- Left Column: Value Headline -->
  <text x="44" y="106" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">Zero-boilerplate PHP stack,</text>
  <text x="44" y="150" fill="url(#headlineGradLight)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">ready in seconds.</text>

  <!-- Left Column: 2x2 Feature Tiles -->
  <!-- Tile 1: Prebuilt GHCR Images -->
  <g>
    <rect x="44" y="182" width="272" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="56" y="195" width="32" height="32" rx="8" fill="#E0F2FE"/>
    <path d="M72 203 L79 207 V215 L72 219 L65 215 V207 Z M65 207 L72 211 L79 207 M72 211 V219" fill="none" stroke="#0284C7" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="98" y="207" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">Prebuilt GHCR Images</text>
    <text x="98" y="225" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">prod · ci · dev variants</text>
  </g>

  <!-- Tile 2: Auto HTTPS & HTTP/3 -->
  <g>
    <rect x="328" y="182" width="272" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="340" y="195" width="32" height="32" rx="8" fill="#DCFCE7"/>
    <path d="M356 203 L363 206 V211 C363 215.5 359.8 218.8 356 220 C352.2 218.8 349 215.5 349 211 V206 Z" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M353.5 211.5 L355.5 213.5 L359 209.5" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="382" y="207" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">Auto HTTPS &amp; HTTP/3</text>
    <text x="382" y="225" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">Caddy server + Vite HMR</text>
  </g>

  <!-- Tile 3: One-Click Wizard -->
  <g>
    <rect x="44" y="250" width="272" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="56" y="263" width="32" height="32" rx="8" fill="#E0E7FF"/>
    <path d="M73 271 L66 280 H72 L71 287 L78 278 H72 Z" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="98" y="275" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">One-Click Wizard</text>
    <text x="98" y="293" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">Laravel · Symfony · Nette</text>
  </g>

  <!-- Tile 4: Renovate Auto-Updates -->
  <g>
    <rect x="328" y="250" width="272" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="340" y="263" width="32" height="32" rx="8" fill="#E0F2FE"/>
    <path d="M362 276 A6.5 6.5 0 0 0 350.5 275 M350 282 A6.5 6.5 0 0 0 361.5 283" fill="none" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M360 272.5 L362.5 276.5 L358.5 277.5 M352 285.5 L349.5 281.5 L353.5 280.5" fill="none" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="382" y="275" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">Renovate Auto-Updates</text>
    <text x="382" y="293" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">Synced with php-platform</text>
  </g>

  <!-- Right Column: Terminal Window (high-contrast dark slate) -->
  <rect x="628" y="34" width="528" height="274" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <path d="M629 48 C629 40.3 635.3 34 643 34 H1141 C1148.7 34 1155 40.3 1155 48 V70 H629 Z" fill="#1E293B"/>
  <line x1="629" y1="70" x2="1155" y2="70" stroke="#334155" stroke-width="1"/>
  <circle cx="650" cy="52" r="5" fill="#EF4444"/>
  <circle cx="667" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="684" cy="52" r="5" fill="#22C55E"/>
  <text x="892" y="56" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">bash — make init</text>

  <!-- Terminal Body (explicit x columns for universal SVG renderer spacing) -->
  <text x="652" y="102" fill="#38BDF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">$</text>
  <text x="670" y="102" fill="#F8FAFC" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">make init</text>

  <text x="652" y="130" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">✓</text>
  <text x="670" y="130" fill="#CBD5E1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Created .env from .env.example</text>

  <text x="652" y="155" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">✓</text>
  <text x="670" y="155" fill="#CBD5E1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Network "apps" ready</text>

  <text x="652" y="180" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">✓</text>
  <text x="670" y="180" fill="#CBD5E1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Pulled ghcr.io/rdurica/php-platform/dev</text>

  <text x="652" y="205" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">✓</text>
  <text x="670" y="205" fill="#CBD5E1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Container frankenphp started</text>

  <line x1="652" y1="224" x2="1132" y2="224" stroke="#1E293B" stroke-width="1"/>

  <text x="652" y="252" fill="#38BDF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">➜</text>
  <text x="670" y="252" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Local:</text>
  <text x="738" y="252" fill="#38BDF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">https://localhost</text>

  <text x="652" y="279" fill="#818CF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">➜</text>
  <text x="670" y="279" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Wizard:</text>
  <text x="738" y="279" fill="#F8FAFC" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Symfony · Laravel · Nette</text>
</svg>
