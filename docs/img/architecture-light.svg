<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img">
  <title>PHP Platform &amp; Starter Kit Architecture</title>
  <defs>
    <linearGradient id="archBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="flowGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <pattern id="archGridLight" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" fill-opacity="0.7"/>
    </pattern>
    <clipPath id="archClipLight">
      <rect x="1" y="1" width="1098" height="418" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#archClipLight)">
    <rect x="1" y="1" width="1098" height="418" rx="16" fill="url(#archBgLight)"/>
    <rect x="1" y="1" width="1098" height="418" rx="16" fill="url(#archGridLight)"/>
  </g>
  <rect x="1" y="1" width="1098" height="418" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- TOP TIER: rdurica/php-platform -->
  <rect x="32" y="20" width="1036" height="150" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="48" y="35" width="10" height="10" rx="3" fill="#4F46E5"/>
  <text x="68" y="45" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700">rdurica/php-platform</text>
  <rect x="802" y="28" width="248" height="24" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="926" y="44" text-anchor="middle" fill="#4338CA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Centralized Infrastructure · SemVer</text>

  <!-- Platform Card 1 -->
  <rect x="52" y="64" width="320" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="72" y="90" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">GHCR Base Images</text>
  <text x="72" y="111" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">prod · ci · dev (FrankenPHP Alpine)</text>
  <rect x="72" y="122" width="160" height="22" rx="6" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
  <text x="152" y="137" text-anchor="middle" fill="#0369A1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">:&lt;semver&gt;-php&lt;minor&gt;</text>

  <!-- Platform Card 2 -->
  <rect x="390" y="64" width="320" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="410" y="90" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">Reusable Workflows</text>
  <text x="410" y="111" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">code-quality · ci-checks · build</text>
  <rect x="410" y="122" width="136" height="22" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="478" y="137" text-anchor="middle" fill="#4338CA" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">@vX.Y.Z releases</text>

  <!-- Platform Card 3 -->
  <rect x="728" y="64" width="320" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="748" y="90" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">Renovate Preset</text>
  <text x="748" y="111" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">Grouped PRs &amp; patch/minor automerge</text>
  <rect x="748" y="122" width="176" height="22" rx="6" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1"/>
  <text x="836" y="137" text-anchor="middle" fill="#15803D" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">renovate-preset.json</text>

  <!-- FLOW CONNECTOR -->
  <line x1="550" y1="170" x2="550" y2="241" stroke="url(#flowGradLight)" stroke-width="2.5"/>
  <path d="M543 236 L550 246 L557 236" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="348" y="191" width="404" height="28" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="550" y="209" text-anchor="middle" fill="#0369A1" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">git tag vX.Y.Z · GHCR Publish &amp; Renovate PRs</text>

  <!-- BOTTOM TIER: php-starter-kit & Downstream Apps -->
  <rect x="32" y="250" width="1036" height="150" rx="14" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2"/>
  <rect x="48" y="265" width="10" height="10" rx="3" fill="#0284C7"/>
  <text x="68" y="275" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700">rdurica/php-starter-kit &amp; Downstream Apps</text>
  <rect x="838" y="258" width="212" height="24" rx="12" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
  <text x="944" y="274" text-anchor="middle" fill="#0369A1" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Thin Consumer Repositories</text>

  <!-- App Card 1 -->
  <rect x="52" y="294" width="237" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="68" y="320" fill="#0284C7" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">build/prod/Dockerfile</text>
  <text x="68" y="342" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">Thin multi-stage Dockerfile</text>
  <text x="68" y="361" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">ci build → prod runtime</text>

  <!-- App Card 2 -->
  <rect x="305" y="294" width="237" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="321" y="320" fill="#0284C7" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">compose*.yaml</text>
  <text x="321" y="342" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">Pulls prebuilt GHCR images</text>
  <text x="321" y="361" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">dev (local) · ci (actions)</text>

  <!-- App Card 3 -->
  <rect x="558" y="294" width="237" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="574" y="320" fill="#4F46E5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">.github/workflows/</text>
  <text x="574" y="342" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">Thin callers + custom ci.yaml</text>
  <text x="574" y="361" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">Pinned @vX.Y.Z + app tests</text>

  <!-- App Card 4 -->
  <rect x="811" y="294" width="237" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="827" y="320" fill="#15803D" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">src/ &amp; renovate.json</text>
  <text x="827" y="342" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">App code &amp; shared preset</text>
  <text x="827" y="361" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">Auto-merges patch &amp; minor</text>
</svg>
